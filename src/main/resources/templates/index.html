<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" th:href="@{/css/shift-form.css}" />
  <title>シフト作成</title>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Shift Match</p>
      <h1>シフト作成</h1>
      <p class="lead">従業員の勤務できる時間帯を入力すると、6 つの勤務枠（8 名）の最適な割り当て案を提案します。</p>
    </header>

    <form
      method="post"
      th:action="@{/shift}"
      th:object="${shiftForm}"
      class="card"
    >
      <!-- 対象月の入力 -->
      <input type="hidden" th:field="*{targetMonth}" />

      <!-- 従業員情報（月間フォーム対応） -->
      <div class="card-head">
        <h2>従業員の勤務できる時間帯</h2>
        <span class="count"><b id="row-count" th:text="${shiftForm.employees.size()}">0</b> 名</span>
      </div>
      <table
        class="input-table"
        th:attr="data-time-options=${#strings.listJoin(timeOptions, '|')}"
      >
        <thead>
          <tr>
            <th></th>
            <th>氏名</th>
            <th>区分</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="employee-rows">
          <tr th:each="employee, stat : ${shiftForm.employees}">
            <td class="move-cell">
              <button type="button" class="move-up-btn" aria-label="上へ">▲</button>
              <button type="button" class="move-down-btn" aria-label="下へ">▼</button>
            </td>
            <td data-label="氏名">
              <input
                type="text"
                th:field="*{employees[__${stat.index}__].name}"
                placeholder="氏名を入力"
              />
            </td>
            <td data-label="区分">
              <select th:field="*{employees[__${stat.index}__].employmentType}">
                <option value="FULL_TIME">常勤</option>
                <option value="PART_TIME">パート</option>
                <option value="MANAGER">管理職</option>
              </select>
            </td>
            <td>
              <button type="button" class="delete-row-btn">削除</button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- T5 で本格実装予定：曜日ごとの基本シフト、個別変更 -->

      <div class="actions">
        <button type="button" id="add-row-btn" class="btn ghost" data-max-rows="12">
          ＋ 行を追加
        </button>
        <button type="submit" class="btn primary">シフトを作成</button>
      </div>
    </form>

    <section class="card result" th:if="${monthlyResult != null}">
      <div class="card-head">
        <h2>割当結果</h2>
      </div>
      <p th:text="'月間シフトが作成されました'"></p>
    </section>
  </main>
</body>
</html>
