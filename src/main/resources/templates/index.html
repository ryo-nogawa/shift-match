<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>月間シフト作成</title>
    <link rel="stylesheet" th:href="@{/css/shift-form.css}" />
  </head>
  <body>
    <div class="app" th:attr="data-initial-step=${initialStep ?: 1}">
      <!-- ステップ表示 -->
      <nav class="step-nav">
        <div class="step-buttons">
          <button type="button" class="step-btn" data-step="1">1 対象月と従業員</button>
          <button type="button" class="step-btn" data-step="2">2 日ごとの希望</button>
          <button type="button" class="step-btn" data-step="3">3 結果</button>
        </div>
      </nav>

      <!-- メインコンテンツエリア -->
      <main class="main-content">
        <form method="post" th:action="@{/shift}" th:object="${shiftForm}" th:attr="data-time-options=${#strings.listJoin(timeOptions, '|')}">
          <!-- エラーアラート -->
          <div th:if="${inputErrors}" role="alert" class="alert">
            <ul>
              <li th:each="error : ${inputErrors}">
                <strong th:text="${error.code()}"></strong>: <span th:text="${error.message()}"></span>
              </li>
            </ul>
          </div>

          <!-- 画面 1: 対象月と従業員 -->
          <section id="screen-1" data-screen="1">
            <!-- 対象月の切り替え -->
            <div class="month-selector">
              <button type="button" id="prev-month-btn" class="month-nav-btn">◀</button>
              <span id="month-label">2026年10月</span>
              <button type="button" id="next-month-btn" class="month-nav-btn">▶</button>
              <input type="hidden" name="targetMonth" th:value="${shiftForm.targetMonth}" />
              <div id="month-summary"></div>
            </div>

            <!-- 従業員一覧 -->
            <div class="employees-section scroll">
              <table class="employee-table">
                <thead>
                  <tr>
                    <th></th>
                    <th>氏名</th>
                    <th>区分</th>
                    <th>基本シフト</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="employee-rows">
                  <tr th:each="employee,iter : ${shiftForm.employees}" class="employee-row" th:attr="data-row-id=${iter.index}">
                    <td class="button-cell">
                      <button type="button" class="move-up-btn">▲</button>
                      <button type="button" class="move-down-btn">▼</button>
                    </td>
                    <td>
                      <input type="text" class="name-input" th:field="*{employees[__${iter.index}__].name}" />
                    </td>
                    <td>
                      <select class="type-select" th:field="*{employees[__${iter.index}__].employmentType}">
                        <option value="FULL_TIME">常勤</option>
                        <option value="PART_TIME">パート</option>
                        <option value="MANAGER">管理職</option>
                      </select>
                    </td>
                    <td class="summary"></td>
                    <td>
                      <button type="button" class="delete-btn">削除</button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <button type="button" id="add-employee-btn">行を追加</button>
            </div>

            <!-- 基本シフトパネル -->
            <div id="base-panels" class="scroll">
              <div th:each="employee,iter : ${shiftForm.employees}" class="base-panel" th:attr="data-row-id=${iter.index}" hidden>
                <table>
                  <thead>
                    <tr>
                      <th>曜日</th>
                      <th>休み</th>
                      <th>開始</th>
                      <th>終了</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr class="day-row" th:each="day,dayIter : ${employee.days}">
                      <td th:text="${dayIter.index == 0 ? '月' : dayIter.index == 1 ? '火' : dayIter.index == 2 ? '水' : dayIter.index == 3 ? '木' : '金'}"></td>
                      <td>
                        <input type="checkbox" class="off-input" th:field="*{employees[__${iter.index}__].days[__${dayIter.index}__].off}" />
                      </td>
                      <td>
                        <select class="start-select" th:field="*{employees[__${iter.index}__].days[__${dayIter.index}__].start}">
                          <option value="">-- 未選択 --</option>
                          <option th:each="time : ${timeOptions}" th:value="${time}" th:text="${time}"></option>
                        </select>
                      </td>
                      <td>
                        <select class="end-select" th:field="*{employees[__${iter.index}__].days[__${dayIter.index}__].end}">
                          <option value="">-- 未選択 --</option>
                          <option th:each="time : ${timeOptions}" th:value="${time}" th:text="${time}"></option>
                        </select>
                      </td>
                      <td>
                        <button type="button" class="copy-to-all-btn">全曜日へ</button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- 画面 2: 日ごとの希望 -->
          <section id="screen-2" data-screen="2" hidden>
            <div id="calendar" class="scroll"></div>
            <div id="day-panel" class="scroll"></div>
            <div id="adjustment-inputs">
              <input th:each="adjustment,iter : ${shiftForm.adjustments}" type="hidden" th:name="'adjustments[' + ${iter.index} + '].date'" th:value="${adjustment.date}" />
              <input th:each="adjustment,iter : ${shiftForm.adjustments}" type="hidden" th:name="'adjustments[' + ${iter.index} + '].employeeName'" th:value="${adjustment.employeeName}" />
              <input th:each="adjustment,iter : ${shiftForm.adjustments}" th:if="${adjustment.off}" type="hidden" th:name="'adjustments[' + ${iter.index} + '].off'" value="true" />
              <input th:each="adjustment,iter : ${shiftForm.adjustments}" th:if="${adjustment.start}" type="hidden" th:name="'adjustments[' + ${iter.index} + '].start'" th:value="${adjustment.start}" />
              <input th:each="adjustment,iter : ${shiftForm.adjustments}" th:if="${adjustment.end}" type="hidden" th:name="'adjustments[' + ${iter.index} + '].end'" th:value="${adjustment.end}" />
            </div>
          </section>

          <!-- 画面 3: 結果 -->
          <section id="screen-3" data-screen="3" hidden>
            <div th:if="${resultView}" class="result">
              <p id="result-summary" class="result-summary" th:text="'営業日数 ' + ${resultView.businessDayCount()} + '・成立 ' + ${resultView.successCount()} + '・不成立 ' + ${resultView.failureCount()}"></p>
              <div class="tab-buttons" role="tablist">
                <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-tab="calendar">カレンダー表示</button>
                <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="employees">従業員別表示</button>
                <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="detail">日別詳細</button>
              </div>
              <div class="tab-panels">
                <div id="tab-calendar" class="tab-panel">
                  <div class="calendar-grid">
                    <div class="calendar-head">月</div>
                    <div class="calendar-head">火</div>
                    <div class="calendar-head">水</div>
                    <div class="calendar-head">木</div>
                    <div class="calendar-head">金</div>
                    <th:block th:each="cell : ${resultView.calendarCells()}">
                      <div th:if="${cell.blank()}" class="blank"></div>
                      <div th:if="${cell.holiday() != null}" class="holiday">
                        <div class="calendar-date" th:text="${cell.holiday().date().dayOfMonth}"></div>
                        <div th:text="${cell.holiday().name()}"></div>
                      </div>
                      <div th:if="${cell.day() != null}" class="calendar-cell">
                        <button type="button" class="calendar-day" th:attr="data-date=${cell.day().date()}" th:text="${cell.day().date().dayOfMonth}"></button>
                        <div th:if="${cell.day().failed()}" class="failed" th:text="'不成立（勤務可 ' + ${cell.day().availableCount()} + ' 名）'"></div>
                        <th:block th:unless="${cell.day().failed()}">
                          <div th:each="group : ${cell.day().groups()}" class="work-group" th:text="${group.workTime()} + ' ' + ${group.names()}"></div>
                        </th:block>
                      </div>
                    </th:block>
                  </div>
                </div>
                <div id="tab-employees" class="tab-panel" hidden>
                  <table class="employee-result-table">
                    <thead>
                      <tr>
                        <th class="sticky-col">従業員</th>
                        <th th:each="day : ${resultView.days()}" th:text="${#temporals.format(day.date(), 'M/d(E)', T(java.util.Locale).JAPAN)}"></th>
                        <th>出勤日数</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="row : ${resultView.employeeRows()}">
                        <td class="sticky-col" th:text="${row.name()}"></td>
                        <td th:each="cell : ${row.cells()}" th:text="${cell}"></td>
                        <td class="work-days" th:text="${row.workDays()}"></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div id="tab-detail" class="tab-panel" hidden></div>
              </div>
            </div>
            <div th:unless="${resultView}">
              <p>結果はまだありません</p>
            </div>
          </section>

          <!-- ボタンパネル -->
          <nav class="button-panel">
            <button type="button" id="prev-btn">戻る</button>
            <button type="button" id="next-btn">次へ</button>
          </nav>
        </form>
      </main>
    </div>

    <script defer th:src="@{/js/step-nav.js}"></script>
    <script defer th:src="@{/js/employee-list.js}"></script>
    <script defer th:src="@{/js/day-adjustments.js}"></script>
    <script defer th:src="@{/js/result-tabs.js}"></script>
  </body>
</html>
