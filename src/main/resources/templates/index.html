<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>シフト作成</title>
</head>
<body>
  <h1>シフト作成</h1>

  <div th:if="${limitExceededError != null}">
    <h2>エラー</h2>
    <p th:text="${limitExceededError}"></p>
  </div>

  <div th:if="${duplicateErrors != null && !duplicateErrors.isEmpty()}">
    <h2>重複エラー</h2>
    <ul>
      <li th:each="error : ${duplicateErrors}">
        氏名「<span th:text="${error.name()}"></span>」が重複しています（該当行：<span th:each="idx, idxStat : ${error.rowIndexes()}"><span th:text="${idx + 1}"></span><span th:if="${!idxStat.last}">, </span></span>行目）
      </li>
    </ul>
  </div>

  <div th:if="${wishErrors != null && !wishErrors.isEmpty()}">
    <h2>入力エラー</h2>
    <ul>
      <li th:each="error : ${wishErrors}">
        <span th:text="|${error.getRowIndex() + 1}行目 ${error.getWishLabel()}: 不正な値です|"></span>
      </li>
    </ul>
  </div>

  <form method="post" th:action="@{/shift}" th:object="${shiftForm}">
    <table>
      <thead>
        <tr>
          <th>氏名</th>
          <th>早番希望</th>
          <th>遅番希望</th>
        </tr>
      </thead>
      <tbody id="employee-rows">
        <tr th:each="employee, stat : ${shiftForm.employees}">
          <td>
            <input
              type="text"
              th:field="*{employees[__${stat.index}__].name}"
              placeholder="氏名を入力"
            />
          </td>
          <td>
            <select th:field="*{employees[__${stat.index}__].earlyWish}">
              <option value="">-- 未選択 --</option>
              <option value="DESIRED">◎ 希望</option>
              <option value="AVAILABLE">○ 可能</option>
              <option value="UNAVAILABLE">× 不可</option>
            </select>
          </td>
          <td>
            <select th:field="*{employees[__${stat.index}__].lateWish}">
              <option value="">-- 未選択 --</option>
              <option value="DESIRED">◎ 希望</option>
              <option value="AVAILABLE">○ 可能</option>
              <option value="UNAVAILABLE">× 不可</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>

    <button type="button" id="add-row-btn">行を追加</button>
    <button type="submit">シフトを作成</button>
  </form>

  <div th:if="${unassignable != null && unassignable}">
    <h2>割当結果</h2>
    <p>条件を満たす組み合わせが見つかりませんでした。</p>
  </div>

  <div th:if="${assignmentResult != null}">
    <h2>割当結果</h2>
    <table border="1">
      <tr>
        <th>枠</th>
        <th>氏名</th>
        <th>休憩</th>
      </tr>
      <tr th:each="breakTime, stat : ${assignmentResult.breakTimes()}">
        <td th:text="${stat.index < 2 ? '早番' : '遅番'}"></td>
        <td th:text="${breakTime.employee().name()}"></td>
        <td>
          <span th:text="${#temporals.format(breakTime.start(), 'HH:mm')}"></span>〜<span
            th:text="${#temporals.format(breakTime.end(), 'HH:mm')}"
          ></span>
        </td>
      </tr>
    </table>
    <p th:text="|スコア: ${assignmentResult.score()}|"></p>
    <div th:if="${assignmentResult.unassignedEmployees().size() > 0}">
      <p>未出勤者:</p>
      <ul>
        <li th:each="employee : ${assignmentResult.unassignedEmployees()}" th:text="${employee.name()}"></li>
      </ul>
    </div>
  </div>

  <script th:src="@{/js/shift-form.js}"></script>
</body>
</html>
